name: Build and Push Side Docker Image

on:
  push:
    branches: [side]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version number
        id: vars
        run: echo "version=1.0.${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Set lowercase repo name
        run: echo "repo_name=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_ENV"

      - name: Read .NET version from the project
        id: dotnet
        run: |
          framework=$(sed -n 's:.*<TargetFramework>net\([0-9]*\.[0-9]*\)</TargetFramework>.*:\1:p' ClubDoorman/ClubDoorman.csproj)
          test -n "$framework"
          echo "version=$framework.x" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.dotnet.outputs.version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet tool restore && dotnet csharpier check .

      - name: Run tests
        run: dotnet test --no-restore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./ClubDoorman
          push: true
          tags: |
            ghcr.io/${{ env.repo_name }}:side
            ghcr.io/${{ env.repo_name }}:latest
            ghcr.io/${{ env.repo_name }}:${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
